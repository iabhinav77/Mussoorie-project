<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Mussoorie Road Network WebGIS</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

html,body{
 margin:0;
 height:100%;
}

#map{
 height:100%;
}

#controls{
 position:absolute;
 top:10px;
 left:60px;
 background:white;
 padding:10px;
 z-index:1000;
 box-shadow:0 0 5px rgba(0,0,0,0.4);
 width:220px;
 font-size:13px;
}

.legend{
 position:absolute;
 bottom:30px;
 right:10px;
 background:white;
 padding:10px;
 font-size:12px;
 z-index:1000;
 box-shadow:0 0 5px rgba(0,0,0,0.4);
 max-height:250px;
 overflow:auto;
}

select{
 width:200px;
 margin-bottom:5px;
}

hr{
 margin:8px 0;
}

</style>
</head>

<body>

<div id="controls">

<b>Layer A</b><br>
<select id="layerA"></select><br>
<select id="fieldA"></select>

<hr>

<b>Layer B</b><br>
<select id="layerB"></select><br>
<select id="fieldB"></select>

</div>

<div id="map"></div>
<div id="legend" class="legend"></div>

<script>

// ================= MAP =================

var map = L.map('map').setView([30.45,78.08],12);

// ================= TILE BASEMAPS =================

var satellite = L.tileLayer('tiles/satellite/{z}/{x}/{y}.png',{
 minZoom:10,
 maxZoom:18
});

var toposheet = L.tileLayer('tiles/toposheet/{z}/{x}/{y}.png',{
 minZoom:10,
 maxZoom:18
});

satellite.addTo(map);

L.control.layers(
 {
  "Satellite":satellite,
  "Toposheet":toposheet
 },
 {}
).addTo(map);


// ================= GEOJSON DATA FILES =================

var geojsonFiles = {

 "Geology": "data/Geology2M_GSI.geojson",
 "Geomorphology_GSI": "data/Geomorphology_GSI.geojson",
 "Geomorphology_Landform": "data/Geomorphology_Landform.geojson",
 "Road_Polylines": "data/Road_Polylines.geojson",
 "Road_Buffer_100m": "data/road_100mbuffer.geojson",
 "Stream_Order": "data/stream_order10000.geojson",
 "WorldCover_LULC_2021": "data/WorldCover_LULC_2021.geojson"

};


var loadedLayers = {};
var layerA = null;
var layerB = null;

var legendDiv = document.getElementById("legend");


// ================= LOAD GEOJSON =================

Object.keys(geojsonFiles).forEach(name=>{

 fetch(geojsonFiles[name])
 .then(res=>res.json())
 .then(data=>{
  loadedLayers[name] = {
   data:data
  };
  updateLayerDropdown();
 });

});


// ================= DROPDOWN POPULATION =================

function updateLayerDropdown(){

var selectA = document.getElementById("layerA");
var selectB = document.getElementById("layerB");

selectA.innerHTML="";
selectB.innerHTML="";

Object.keys(loadedLayers).forEach(name=>{

 let optA=document.createElement("option");
 optA.value=name;
 optA.text=name;
 selectA.appendChild(optA);

 let optB=document.createElement("option");
 optB.value=name;
 optB.text=name;
 selectB.appendChild(optB);

});

selectA.onchange=function(){
 activateLayerA(this.value);
};

selectB.onchange=function(){
 activateLayerB(this.value);
};

if(Object.keys(loadedLayers).length>0){

 activateLayerA(Object.keys(loadedLayers)[0]);
 activateLayerB(Object.keys(loadedLayers)[1] || Object.keys(loadedLayers)[0]);

}

}


// ================= ACTIVATE LAYER A =================

function activateLayerA(name){

var data = loadedLayers[name].data;
var fields = Object.keys(data.features[0].properties);

var selector = document.getElementById("fieldA");
selector.innerHTML="";

fields.forEach(f=>{
 let opt=document.createElement("option");
 opt.value=f;
 opt.text=f;
 selector.appendChild(opt);
});

selector.onchange=function(){
 drawLayerA(name,this.value);
};

drawLayerA(name,fields[0]);

}


// ================= ACTIVATE LAYER B =================

function activateLayerB(name){

var data = loadedLayers[name].data;
var fields = Object.keys(data.features[0].properties);

var selector = document.getElementById("fieldB");
selector.innerHTML="";

fields.forEach(f=>{
 let opt=document.createElement("option");
 opt.value=f;
 opt.text=f;
 selector.appendChild(opt);
});

selector.onchange=function(){
 drawLayerB(name,this.value);
};

drawLayerB(name,fields[0]);

}


// ================= COLOR PALETTES =================

var paletteA=[
 "#e41a1c","#377eb8","#4daf4a",
 "#984ea3","#ff7f00","#ffff33",
 "#a65628","#f781bf","#999999"
];

var paletteB=[
 "#1b9e77","#d95f02","#7570b3",
 "#e7298a","#66a61e","#e6ab02",
 "#a6761d","#666666"
];


// ================= DRAW LAYER A =================

function drawLayerA(name,field){

if(layerA) map.removeLayer(layerA);

var data = loadedLayers[name].data;

var values=[...new Set(
 data.features.map(f=>f.properties[field])
)];

layerA = L.geoJSON(data,{
 style:function(feature){

  var val=feature.properties[field];
  var idx=values.indexOf(val);

  var geomType=feature.geometry.type;

  if(geomType==="LineString" || geomType==="MultiLineString"){

   return{
    color:paletteA[idx%paletteA.length],
    weight:3
   };

  }

  return{
   color:paletteA[idx%paletteA.length],
   weight:1,
   fillOpacity:0.5
  };

 }
}).addTo(map);

updateLegend(values,field,"A");

}


// ================= DRAW LAYER B =================

function drawLayerB(name,field){

if(layerB) map.removeLayer(layerB);

var data = loadedLayers[name].data;

var values=[...new Set(
 data.features.map(f=>f.properties[field])
)];

layerB = L.geoJSON(data,{
 style:function(feature){

  var val=feature.properties[field];
  var idx=values.indexOf(val);

  var geomType=feature.geometry.type;

  if(geomType==="LineString" || geomType==="MultiLineString"){

   return{
    color:paletteB[idx%paletteB.length],
    weight:2,
    dashArray:"5,5"
   };

  }

  return{
   color:paletteB[idx%paletteB.length],
   weight:1,
   fillOpacity:0.25
  };

 }
}).addTo(map);

updateLegend(values,field,"B");

}


// ================= LEGEND =================

function updateLegend(values,field,layerName){

var palette = layerName==="A" ? paletteA : paletteB;

legendDiv.innerHTML="<b>Layer "+layerName+" : "+field+"</b><br>";

values.forEach((v,i)=>{

 legendDiv.innerHTML+=
 '<div><span style="background:'+
 palette[i%palette.length]+
 ';width:15px;height:15px;display:inline-block;margin-right:5px;"></span>'
 +v+"</div>";

});

}

</script>

</body>
</html>
