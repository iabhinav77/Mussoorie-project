<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Mussoorie WebGIS</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
html, body { margin:0; height:100%; }
#map { height:100%; }

#fieldSelector {
  position:absolute;
  top:10px;
  left:60px;
  z-index:1000;
  background:white;
  padding:5px;
}

.legend {
  position:absolute;
  bottom:30px;
  right:10px;
  background:white;
  padding:10px;
  font-size:12px;
  z-index:1000;
}
</style>
</head>

<body>

<select id="fieldSelector"></select>
<div id="map"></div>
<div id="legend" class="legend"></div>

<script>

// ================= MAP INIT =================

var map = L.map('map').setView([30.45, 78.08], 12);

// ================= TILE LAYERS =================

var satellite = L.tileLayer('satellite/{z}/{x}/{y}.png', {
    minZoom: 12,
    maxZoom: 16
});

var toposheet = L.tileLayer('toposheet/{z}/{x}/{y}.png', {
    minZoom: 12,
    maxZoom: 16
});

satellite.addTo(map);

var baseMaps = {
    "Satellite": satellite,
    "Toposheet": toposheet
};

// ================= GLOBAL VARIABLES =================

var currentLayer = null;
var geojsonData = null;
var legendDiv = document.getElementById("legend");

// ================= COLOR GENERATOR =================

function getColor(value, index) {
    var colors = [
        "#e41a1c","#377eb8","#4daf4a","#984ea3",
        "#ff7f00","#ffff33","#a65628","#f781bf","#999999"
    ];
    return colors[index % colors.length];
}

// ================= LOAD GEOJSON =================

fetch("Geology2M_GSI.geojson")
.then(res => res.json())
.then(data => {

    geojsonData = data;

    // Populate dropdown with fields
    var fields = Object.keys(data.features[0].properties);

    var selector = document.getElementById("fieldSelector");
    fields.forEach(field => {
        var option = document.createElement("option");
        option.value = field;
        option.text = field;
        selector.appendChild(option);
    });

    drawLayer(fields[0]);

    selector.addEventListener("change", function() {
        drawLayer(this.value);
    });

});

// ================= DRAW LAYER BASED ON FIELD =================

function drawLayer(fieldName) {

    if (currentLayer) {
        map.removeLayer(currentLayer);
    }

    var uniqueValues = [...new Set(
        geojsonData.features.map(f => f.properties[fieldName])
    )];

    currentLayer = L.geoJSON(geojsonData, {

        style: function(feature) {
            var val = feature.properties[fieldName];
            var index = uniqueValues.indexOf(val);
            return {
                color: getColor(val, index),
                weight: 1,
                fillOpacity: 0.6
            };
        }

    }).addTo(map);

    updateLegend(uniqueValues, fieldName);
}

// ================= LEGEND =================

function updateLegend(values, fieldName) {

    legendDiv.innerHTML = "<b>" + fieldName + "</b><br>";

    values.forEach((val, i) => {
        legendDiv.innerHTML +=
            '<div><span style="background:' +
            getColor(val, i) +
            ';width:15px;height:15px;display:inline-block;margin-right:5px;"></span>' +
            val + '</div>';
    });
}

// ================= LAYER CONTROL =================

L.control.layers(baseMaps).addTo(map);

</script>

</body>
</html>
