<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Mussoorie WebGIS</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
html, body { margin:0; padding:0; height:100%; }
#map { height:100%; width:100%; }
.legend {
    background:white;
    padding:10px;
    font-size:12px;
}
</style>
</head>

<body>

<div id="map"></div>

<script>

// ================= MAP INIT =================

// ⚠️ CHANGE ZOOM IF YOUR TILES START AT DIFFERENT LEVEL
var map = L.map('map').setView([30.45, 78.08], 12);

// ================= BASE LAYERS =================

// Satellite Tiles
var satellite = L.tileLayer('satellite/{z}/{x}/{y}.png', {
    maxZoom: 18,
    minZoom: 10
});

// Toposheet Tiles
var toposheet = L.tileLayer('toposheet/{z}/{x}/{y}.png', {
    maxZoom: 18,
    minZoom: 10
});

// Add default base
satellite.addTo(map);

var baseMaps = {
    "Satellite": satellite,
    "Toposheet": toposheet
};

// ================= GEOJSON OVERLAYS =================

var geologyLayer;
var geomorphologyLayer;
var roadsLayer;

fetch('Geology2M_GSI.geojson')
.then(res => res.json())
.then(data => {
    geologyLayer = L.geoJSON(data, {
        style: { color: "red", weight: 1 }
    });
});

fetch('Geomorphology_GSI.geojson')
.then(res => res.json())
.then(data => {
    geomorphologyLayer = L.geoJSON(data, {
        style: { color: "blue", weight: 1 }
    });
});

fetch('road.geojson')
.then(res => res.json())
.then(data => {
    roadsLayer = L.geoJSON(data, {
        style: { color: "black", weight: 2 }
    });
});

// ================= LAYER CONTROL =================

setTimeout(function() {

    var overlayMaps = {};

    if (geologyLayer) overlayMaps["Geology"] = geologyLayer;
    if (geomorphologyLayer) overlayMaps["Geomorphology"] = geomorphologyLayer;
    if (roadsLayer) overlayMaps["Roads"] = roadsLayer;

    L.control.layers(baseMaps, overlayMaps).addTo(map);

}, 1500);

</script>

</body>
</html>
